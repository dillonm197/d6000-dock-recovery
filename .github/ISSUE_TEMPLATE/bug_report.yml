name: Bug report
description: Something doesn't work as documented (installing, uninstalling, logging, settings).
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead. Include any command output.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mac model
      description: Output of `sysctl -n hw.model`
      placeholder: Mac15,7
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Output of `sw_vers -productVersion`
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: d6000-recovery version
      description: Output of `/Library/PrivilegedHelperTools/local.d6000-recovery --version`
    validations:
      required: true
  - type: input
    id: dock
    attributes:
      label: Dock
      description: Model (D6000 or D6000S) and firmware version, if you know it
  - type: textarea
    id: list
    attributes:
      label: Port list
      description: Output of `/Library/PrivilegedHelperTools/local.d6000-recovery --list`, ideally while the dock is stuck
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Output of `tail -n 200 /Library/Logs/D6000Recovery/events.log`, covering at least a minute before and after the event.
        The log holds port names, counters and timings, not personal data, but please read it before posting.
      render: text
    validations:
      required: true
