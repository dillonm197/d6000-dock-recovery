name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.preset }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run tests
        run: cmake --workflow --preset ${{ matrix.preset }}

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: brew install llvm shellcheck
      - name: clang-format (Microsoft style)
        run: |
          "$(brew --prefix llvm)/bin/clang-format" --dry-run --Werror src/*.cpp src/*.hpp tests/*.cpp
      - name: Configure (compile database for clang-tidy)
        run: cmake --preset debug -DD6000_BUILD_TESTS=OFF
      - name: clang-tidy (C++ Core Guidelines)
        run: |
          llvm="$(brew --prefix llvm)/bin"
          "$llvm/run-clang-tidy" -clang-tidy-binary "$llvm/clang-tidy" -p build/debug -quiet "$PWD/src/.*\.cpp$"
      - name: ShellCheck
        run: shellcheck -o all -e SC2250,SC2312 scripts/*.sh
